<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Vielen Dank für Ihre Anfrage – ZofiGlas</title>

  <meta
    name="description"
    content="Vielen Dank für Ihre Anfrage bei ZofiGlas. Wir melden uns schnellstmöglich bei Ihnen.">

  <meta
    name="theme-color"
    content="#24A9F3">

  <meta
    name="robots"
    content="noindex, follow">

  <link
    rel="stylesheet"
    href="style.css?v=11.2">
</head>

<body class="thank-you-body">

  <main class="thank-you-page">

    <section
      class="thank-you-card"
      aria-labelledby="thank-you-title">

      <a
        href="index.html"
        class="thank-you-logo-link"
        aria-label="Zur ZofiGlas Startseite">

        <img
          src="logo-bild-svg.jpeg"
          alt="ZofiGlas"
          class="thank-you-logo">

      </a>

      <div
        class="thank-you-icon"
        aria-hidden="true">
        ✓
      </div>

      <h1 id="thank-you-title">
        Vielen Dank für Ihre Anfrage!
      </h1>

      <p class="thank-you-lead">
        Ihre Anfrage wurde erfolgreich an ZofiGlas übermittelt.
      </p>

      <p>
        Wir prüfen Ihr Anliegen und melden uns so schnell wie möglich
        bei Ihnen.
      </p>

      <div class="thank-you-note">
        In dringenden Fällen erreichen Sie uns telefonisch unter
        <a href="tel:+41796628106">
          079 662 81 06
        </a>.
      </div>

      <div class="thank-you-actions">

        <a
          href="index.html"
          class="thank-you-button">
          Zurück zur Startseite
        </a>

        <a
          href="tel:+41796628106"
          class="thank-you-button thank-you-button-secondary">
          Jetzt anrufen
        </a>

      </div>

    </section>

  </main>

</body>

</html>
