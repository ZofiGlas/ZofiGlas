<!DOCTYPE html>
<html lang="de-CH">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Vielen Dank für Ihre Anfrage – ZofiGlas</title>

  <meta
    name="description"
    content="Vielen Dank für Ihre Anfrage bei ZofiGlas. Wir melden uns schnellstmöglich bei Ihnen.">

  <meta
    name="theme-color"
    content="#24A9F3">

  <meta
    name="robots"
    content="noindex, follow">

  <link
    rel="stylesheet"
    href="style.css?v=12.1">

  <style>
    .thank-you-page{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:32px 18px;
      background:linear-gradient(
        135deg,
        #f6f7f9,
        #ffffff
      );
    }

    .thank-you-card{
      width:100%;
      max-width:680px;
      padding:40px 32px;
      text-align:center;
      background:#ffffff;
      border:1px solid #e6e9ee;
      border-top:5px solid #24A9F3;
      border-radius:16px;
      box-shadow:0 24px 60px rgba(16,24,40,0.10);
    }

    .thank-you-logo{
      display:block;
      width:auto;
      max-width:320px;
      max-height:160px;
      margin:0 auto 18px;
      object-fit:contain;
    }

    .thank-you-icon{
      display:flex;
      align-items:center;
      justify-content:center;
      width:72px;
      height:72px;
      margin:0 auto 20px;
      color:#ffffff;
      background:linear-gradient(
        135deg,
        #24A9F3,
        #1289D1
      );
      border-radius:50%;
      font-size:36px;
      font-weight:800;
      box-shadow:0 12px 30px rgba(36,169,243,0.25);
    }

    .thank-you-card h1{
      margin-bottom:12px;
      color:#0f1724;
      font-family:"Inter","Segoe UI",Arial,sans-serif;
      font-size:2rem;
      line-height:1.2;
    }

    .thank-you-card p{
      max-width:540px;
      margin:0 auto 14px;
      color:#4b5563;
      font-family:"Inter","Segoe UI",Arial,sans-serif;
      font-size:1.05rem;
      line-height:1.7;
    }

    .thank-you-note{
      padding:14px 18px;
      margin-top:20px;
      color:#0C6CAD;
      background:rgba(36,169,243,0.09);
      border:1px solid rgba(36,169,243,0.20);
      border-radius:10px;
      font-family:"Inter","Segoe UI",Arial,sans-serif;
      font-weight:700;
    }

    .thank-you-actions{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:12px;
      margin-top:26px;
    }

    .thank-you-button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      padding:12px 22px;
      color:#ffffff;
      background:linear-gradient(
        135deg,
        #24A9F3,
        #1289D1
      );
      border:1px solid transparent;
      border-radius:999px;
      font-family:"Inter","Segoe UI",Arial,sans-serif;
      font-size:1rem;
      font-weight:800;
      text-decoration:none;
      box-shadow:0 12px 30px rgba(36,169,243,0.22);
      transition:
        color 180ms ease,
        background 180ms ease,
        border-color 180ms ease,
        transform 180ms ease,
        box-shadow 180ms ease;
    }

    .thank-you-button:hover{
      color:#ffffff;
      background:linear-gradient(
        135deg,
        #1289D1,
        #0C6CAD
      );
      transform:translateY(-2px);
      box-shadow:0 16px 36px rgba(36,169,243,0.32);
    }

    .thank-you-button:focus-visible{
      outline:none;
      box-shadow:
        0 0 0 5px rgba(36,169,243,0.20),
        0 16px 36px rgba(36,169,243,0.25);
    }

    .thank-you-button-secondary{
      color:#1289D1;
      background:#ffffff;
      border-color:rgba(36,169,243,0.35);
      box-shadow:none;
    }

    .thank-you-button-secondary:hover{
      color:#ffffff;
      background:#1289D1;
      border-color:#1289D1;
      box-shadow:0 12px 28px rgba(36,169,243,0.22);
    }

    @media (max-width:600px){

      .thank-you-page{
        padding:20px 14px;
      }

      .thank-you-card{
        padding:30px 20px;
      }

      .thank-you-logo{
        max-width:260px;
        max-height:130px;
      }

      .thank-you-card h1{
        font-size:1.6rem;
      }

      .thank-you-actions{
        flex-direction:column;
      }

      .thank-you-button{
        width:100%;
      }
    }

    @media (prefers-reduced-motion:reduce){

      .thank-you-button{
        transition:none;
      }

      .thank-you-button:hover{
        transform:none;
      }
    }
  </style>
</head>

<body>

  <main class="thank-you-page">

    <section
      class="thank-you-card"
      aria-labelledby="thank-you-title">

      <img
        src="logo-bild-svg.jpeg"
        alt="ZofiGlas"
        class="thank-you-logo">

      <div
        class="thank-you-icon"
        aria-hidden="true">
        ✓
      </div>

      <h1 id="thank-you-title">
        Vielen Dank für Ihre Anfrage!
      </h1>

      <p>
        Ihre Anfrage wurde erfolgreich an ZofiGlas übermittelt.
      </p>

      <p>
        Wir prüfen Ihr Anliegen und melden uns schnellstmöglich
        bei Ihnen.
      </p>

      <div class="thank-you-note">
        In dringenden Fällen erreichen Sie uns telefonisch unter
        079 662 81 06.
      </div>

      <div class="thank-you-actions">

        <a
          href="./"
          class="thank-you-button">
          Zurück zur Startseite
        </a>

        <a
          href="tel:+41796628106"
          class="thank-you-button thank-you-button-secondary">
          Jetzt anrufen
        </a>

      </div>

    </section>

  </main>

</body>

</html>
